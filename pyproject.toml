[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rednexus-ai"
version = "2.0.0rc1"
description = "Governed orchestration platform for the Red ecosystem"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
rednexus = "rednexus.platform.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["rednexus*"]

[tool.setuptools.package-data]
rednexus = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicitly configured PostgreSQL or Redis", "browser: requires Playwright"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
